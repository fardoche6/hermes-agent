[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-human-gate-notifier"
version = "0.1.0"
description = "Stable scaffold for Hermes human-gate notification rendering and delivery."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
